import org.apache.tools.ant.filters.ReplaceTokens
import org.gradle.api.tasks.testing.logging.TestExceptionFormat
import org.gradle.api.tasks.testing.logging.TestLogEvent

plugins {
    alias(libs.plugins.nexusPublish)
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

group = 'org.cip4.lib.xjdf'
description = 'CIP4 xJdfLib'
version = providers.gradleProperty('projectVersion').getOrElse('2.3.x-DEV')

def generatedDir = layout.projectDirectory.dir('src/generated')
def generatedSources = layout.projectDirectory.dir('src/generated/java')
def generatedResources = layout.projectDirectory.dir('src/generated/resources')
def schemaFile = layout.projectDirectory.file('src/main/resources/org/cip4/lib/xjdf/schema/jdfschema_2_x.xsd')
def bindingFile = layout.projectDirectory.file('src/main/resources/org/cip4/lib/xjdf/binding.xjb')

def buildInstant = new Date()
def buildTimestamp = buildInstant.format("yyyy-MM-dd'T'HH:mm:ss.SSSXXX", TimeZone.getTimeZone('UTC'))
def manifestBuildDate = buildInstant.format("yyyy-MM-dd'T'HH:mm:ssZ", TimeZone.getTimeZone('UTC'))

java {
    withJavadocJar()
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = project.name

            from components.java
            versionMapping {
                usage('java-api') {
                    fromResolutionOf('runtimeClasspath')
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }
            pom {
                name = project.description
                description = 'CIP4 XJDF Library'
                url = 'https://github.com/cip4/xJdfLib'

                organization {
                    name = 'CIP4 Organization'
                    url = 'https://www.cip4.org'
                }
                developers {
                    developer {
                        id = 'cip4-development'
                        name = 'CIP4 Development'
                    }
                }
                licenses {
                    license {
                        name = 'CIP4 Software License'
                        url = 'https://github.com/cip4/xJdfLib/blob/main/LICENSE.md'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/cip4/xJdfLib.git'
                    developerConnection = 'scm:git:https://github.com/cip4/xJdfLib.git'
                    url = 'https://github.com/cip4/xJdfLib'
                }
            }
        }
    }
}

// Downloads the XSDs from schema.cip4.org during configuration on every build.
// This behaviour is intentional; see AGENTS.md before changing it. The existing file is kept if the
// download fails, so an unreachable schema host does not break or delete the tracked schemas.
def schemaNames = ['jdfschema_2_0', 'jdfschema_2_1', 'jdfschema_2_2', 'jdfschema_2_x']
schemaNames.forEach { schemaName ->
    println "Update ${schemaName} from https://schema.cip4.org..."
    def dest = layout.projectDirectory.file(
        "src/main/resources/org/cip4/lib/xjdf/schema/${schemaName}.xsd"
    ).asFile
    try {
        dest.text = URI.create("https://schema.cip4.org/${schemaName}/xjdf.xsd").toURL().text
    } catch (Exception e) {
        logger.warn("Could not update ${schemaName}, keeping the existing file: ${e.message}")
    }
}

tasks.register('updateSchema') {
    group = 'build'
    description = 'Downloads the XJDF schemas from schema.cip4.org (also downloaded during configuration of every build).'
}

nexusPublishing {
    repositories {
        sonatype {
            nexusUrl = uri('https://ossrh-staging-api.central.sonatype.com/service/local/')
            snapshotRepositoryUrl = uri('https://central.sonatype.com/repository/maven-snapshots/')
            username = providers.gradleProperty('ossrhUsername').getOrElse('')
            password = providers.gradleProperty('ossrhPassword').getOrElse('')
            stagingProfileId = '105e2b532689c6'
            packageGroup = 'org.cip4'
        }
    }
}

configurations {
    xjc
}

repositories {
    mavenCentral()
}

signing {
    required = !version.endsWith('SNAPSHOT')
        && (providers.gradleProperty('signing.keyId').isPresent() || providers.gradleProperty('signingKey').isPresent())
    sign publishing.publications.mavenJava
}

tasks.named('javadoc') {
    failOnError = true
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.overview = layout.projectDirectory.file('src/main/javadoc/overview.html').asFile
    options.windowTitle = "CIP4 xJdfLib ${version} API"
    options.docTitle = "CIP4 xJdfLib ${version} API"
    options.addBooleanOption('notimestamp', true)
    options.addBooleanOption('Xdoclint:all,-missing', true)
    options.addBooleanOption('Xdoclint/package:-org.cip4.lib.xjdf.schema', true)
    // External links make offline builds fail, so they are enabled in CI and with -PjavadocLinks.
    if (providers.environmentVariable('CI').isPresent() || providers.gradleProperty('javadocLinks').isPresent()) {
        options.links += [
            'https://docs.oracle.com/en/java/javase/21/docs/api/',
            'https://jakarta.ee/specifications/xml-binding/4.0/apidocs/'
        ]
    }
}

def resourceTokens = [
    name      : project.name,
    version   : project.version.toString(),
    artifactId: project.name,
    timestamp : buildTimestamp
]

tasks.named('processResources', ProcessResources) {
    filesMatching(['**/*.properties']) {
        filter(ReplaceTokens, tokens: resourceTokens)
    }
}

dependencies {
    api libs.jakartaXmlBindApi
    compileOnlyApi libs.jetbrainsAnnotations
    implementation libs.jaxbRuntime
    compileOnly libs.jakartaAnnotationApi
    implementation libs.commonsLang3
    implementation libs.reflections

    testImplementation platform(libs.junitBom)
    testImplementation libs.junitJupiter
    testRuntimeOnly libs.junitPlatformLauncher
    testImplementation libs.mockitoCore
    testImplementation libs.hamcrest
    testImplementation libs.junitPioneer

    xjc libs.jaxbCore
    xjc libs.jaxbXjc
    xjc libs.jaxbImpl
    xjc libs.jakartaXmlBindApi
    xjc libs.hisrcBasicjaxb
    xjc libs.hisrcBasicjaxbAnt
    xjc libs.hisrcHyperjaxbAnnoxPlugin
    xjc libs.jaxb2FluentApi
}

def xjcTask = tasks.register('xjc', JavaExec) {
    group = 'build'
    description = 'Generates JAXB classes from the XJDF schema.'
    classpath = configurations.xjc
    mainClass = 'com.sun.tools.xjc.Driver'
    jvmArgs '-Duser.language=en', '-Duser.country=US'

    inputs.files(schemaFile, bindingFile)
    inputs.files(configurations.xjc)
    outputs.dir(generatedSources)
    outputs.dir(generatedResources)

    def episodeFile = generatedResources.file('META-INF/sun-jaxb.episode').asFile
    args = [
        '-d', generatedSources.asFile.absolutePath,
        '-b', bindingFile.asFile.absolutePath,
        '-episode', episodeFile.absolutePath,
        '-extension',
        '-mark-generated',
        '-noDate',
        '-no-header',
        '-readOnly',
        '-Xfluent-api',
        '-Xinject-code',
        '-XsimpleEquals',
        '-XsimpleHashCode',
        '-Xannotate',
        '-quiet',
        schemaFile.asFile.absolutePath
    ]

    doFirst {
        delete generatedSources
        delete generatedResources
        generatedSources.asFile.mkdirs()
        generatedResources.dir('META-INF').asFile.mkdirs()
    }

    doLast {
        // Move the package javadoc generated by the bindings into package-info.java, because javadoc
        // prefers package-info.java and ignores package.html when both files are present.
        def schemaPackageInfo = generatedSources.file('org/cip4/lib/xjdf/schema/package-info.java').asFile
        def schemaPackageHtml = generatedSources.file('org/cip4/lib/xjdf/schema/package.html').asFile
        if (schemaPackageHtml.exists() && schemaPackageInfo.exists()) {
            def javadoc = schemaPackageHtml.text.trim().readLines().collect { " * $it" }.join('\n')
            schemaPackageInfo.setWritable(true)
            schemaPackageInfo.text = "/**\n$javadoc\n */\n" + schemaPackageInfo.text
            schemaPackageInfo.setWritable(false)
            schemaPackageHtml.setWritable(true)
            schemaPackageHtml.delete()
        }
    }
}

tasks.named('clean') {
    delete generatedDir
}

sourceSets {
    main {
        java.srcDir(xjcTask.map { generatedSources })
        output.dir(generatedResources, builtBy: xjcTask)
    }
}

tasks.named('test') {
    useJUnitPlatform()
    maxParallelForks = Runtime.runtime.availableProcessors()
}

tasks.named('jar') {
    manifest {
        attributes(
            'Implementation-Build-Date': manifestBuildDate,
            'Implementation-Title': project.description,
            'Implementation-Version': project.version,
            'Implementation-Vendor-Id': project.group,
            'Specification-Title': project.description,
            'Specification-Version': project.version,
            'Build-Jdk': java.toolchain.languageVersion.get().toString(),
        )
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.withType(Test).configureEach {
    testLogging {
        events TestLogEvent.FAILED,
               TestLogEvent.SKIPPED
        exceptionFormat = TestExceptionFormat.FULL
        showExceptions = true
        showCauses = true
        showStackTraces = true
    }
}
