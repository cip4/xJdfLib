name: Setup
description: Sets up JDK 21 and Gradle with caching.

inputs:
  dependency-graph:
    description: Dependency graph handling passed to gradle/actions/setup-gradle.
    required: false
    default: disabled

runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 21
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        dependency-graph: ${{ inputs.dependency-graph }}
