name: Publish

# This build process is triggered on pushes to main (SNAPSHOT releases) and on version tags (releases).
# It builds and tests the project and publishes the artifacts to the Central Maven Repository. Version tags are also
# published to the projects Release page on github.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources...
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up build environment
        uses: ./.github/actions/setup
        with:
          dependency-graph: generate-and-submit

      - name: Determine version
        id: version
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -n "$TAG" ]; then
            VERSION="$TAG"
          else
            VERSION=$( git describe --tags --abbrev=0 | sed "s/^v\?\(.*\)\.[[:digit:]]\+$/\\1.x-SNAPSHOT/")
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Publish artifacts to Maven Central Repository
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        run: |
          echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/secring.gpg"
          ./gradlew build publishToSonatype closeAndReleaseSonatypeStagingRepository \
              -Psigning.keyId=$SIGNING_KEY_ID \
              -Psigning.password=$SIGNING_PASSWORD \
              -Psigning.secretKeyRingFile=$RUNNER_TEMP/secring.gpg \
              -PossrhUsername=$OSSRH_USERNAME \
              -PossrhPassword=$OSSRH_PASSWORD \
              -PprojectVersion=${{ steps.version.outputs.VERSION }} \
              --no-daemon

      - name: Ensuring Deployment Visibility In The Central Publisher Portal
      # https://central.sonatype.org/publish/publish-portal-ossrh-staging-api/#ensuring-deployment-visibility-in-the-central-publisher-portal
        run: |
          # Make HTTP POST request with no body - curl will exit with non-zero code on failure
          curl -X POST \
            -u "$OSSRH_USERNAME:$OSSRH_PASSWORD" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/org.cip4"
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}

      - name: Upload Artifacts to GitHub Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: libs
          path: build/libs

      - name: Upload Test Results to GitHub Build Artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results linux
          path: build/reports/tests/test

      - name: Attach files to GitHub Release
        if: steps.version.outputs.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.TAG }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" build/libs/* --clobber
          else
            gh release create "$TAG" build/libs/* --generate-notes
          fi

  javadoc-io:
    name: Warm javadoc.io
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Wait for Maven Central and javadoc.io
        env:
          VERSION: ${{ github.ref_name }}
          ARTIFACT: xJdfLib
          GROUP_PATH: org/cip4/lib/xjdf
        run: |
          central="https://repo1.maven.org/maven2/${GROUP_PATH}/${ARTIFACT}/${VERSION}/${ARTIFACT}-${VERSION}-javadoc.jar"
          static="https://javadoc.io/static/org.cip4.lib.xjdf/${ARTIFACT}/${VERSION}/index.html"

          echo "Waiting for ${central} ..."
          for i in $(seq 1 90); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' -I "$central")" = "200" ]; then
              echo "Maven Central synced after ${i} attempt(s)."
              break
            fi
            if [ "$i" = "90" ]; then
              echo "::error::Javadoc jar did not appear on Maven Central within 90 minutes."
              exit 1
            fi
            sleep 60
          done

          echo "Priming javadoc.io ..."
          for i in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' "$static")" = "200" ]; then
              echo "javadoc.io is serving ${VERSION}."
              exit 0
            fi
            sleep 60
          done
          echo "::error::javadoc.io did not serve ${VERSION} within 60 minutes after Central sync."
          exit 1
